name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven build
        id: build
        run: |
          set -o pipefail
          mvn -B -ntp clean package 2>&1 | tee build.log

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DuelSira
          path: target/DuelSira-*.jar

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

  e2e:
    name: E2E test (Paper 1.20.1 + WorldEdit + WorldGuard + botlar)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: DuelSira
          path: dist

      - name: Prepare server
        run: bash test/setup-server.sh "$(ls $PWD/dist/DuelSira-*.jar | head -1)"

      - name: Run E2E
        id: e2e
        run: |
          cd test && npm install --no-audit --no-fund --silent && cd ..
          set -o pipefail
          timeout 1200 node test/e2e.js 2>&1 | tee e2e.log
          echo "--- duel_history ---" | tee -a e2e.log
          sqlite3 server/plugins/DuelSira/dueldata.db "select id,duel_type,arena_name,winner_uuid is not null,duration_seconds from duel_history" 2>&1 | tee -a e2e.log

      - name: Upload E2E logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            e2e.log
            server/logs/latest.log

  release:
    name: Release (pom.xml surumu, yoksa olusturulur)
    needs: [build, e2e]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: DuelSira
          path: dist

      - name: Create release if missing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(grep -m1 -oP '(?<=<version>)[^<]+' pom.xml)
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "$TAG zaten var, atlaniyor."
            exit 0
          fi
          git archive --format=zip --prefix=DuelSira/ -o "dist/DuelSira-${TAG}-source.zip" HEAD
          NOTES="RELEASE_NOTES.md"
          [ -f "$NOTES" ] || echo "$TAG" > "$NOTES"
          gh release create "$TAG" dist/* --target "${GITHUB_SHA}" --title "DuelSira ${TAG}" --notes-file "$NOTES"
