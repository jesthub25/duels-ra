name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven build
        id: build
        run: |
          set -o pipefail
          mvn -B -ntp clean package 2>&1 | tee build.log

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DuelSira
          path: target/DuelSira-*.jar

      - name: Publish CI log
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="${{ steps.build.outcome }}"
          touch build.log
          if ! gh release view ci-log >/dev/null 2>&1; then
            gh release create ci-log --prerelease --title "CI log" --notes "init" --target "${GITHUB_SHA}"
          fi
          gh release edit ci-log --notes "sha=${GITHUB_SHA} status=${STATUS}"
          gh release upload ci-log build.log --clobber
          if [ "$STATUS" = "success" ]; then
            cp target/DuelSira-*.jar DuelSira-ci.jar
            gh release upload ci-log DuelSira-ci.jar --clobber
          fi

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v') && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="RELEASE_NOTES.md"
          [ -f "$NOTES" ] || echo "${GITHUB_REF_NAME}" > "$NOTES"
          gh release create "${GITHUB_REF_NAME}" target/DuelSira-*.jar --title "DuelSira ${GITHUB_REF_NAME}" --notes-file "$NOTES"
