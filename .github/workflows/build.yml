name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Maven build
        id: build
        run: |
          set -o pipefail
          mvn -B -ntp clean package 2>&1 | tee build.log

      - name: Upload artifact
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DuelSira
          path: target/DuelSira-*.jar

      - name: Publish CI log
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="${{ steps.build.outcome }}"
          touch build.log
          if ! gh release view ci-log >/dev/null 2>&1; then
            gh release create ci-log --prerelease --title "CI log" --notes "init" --target "${GITHUB_SHA}"
          fi
          gh release edit ci-log --notes "sha=${GITHUB_SHA} status=${STATUS}"
          gh release upload ci-log build.log --clobber
          if [ "$STATUS" = "success" ]; then
            cp target/DuelSira-*.jar DuelSira-ci.jar
            gh release upload ci-log DuelSira-ci.jar --clobber
          fi

  e2e:
    name: E2E test (Paper 1.20.1 + WorldEdit + WorldGuard + botlar)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: DuelSira
          path: dist

      - name: Prepare server
        run: bash test/setup-server.sh "$(ls $PWD/dist/DuelSira-*.jar | head -1)"

      - name: Run E2E
        id: e2e
        run: |
          cd test && npm install --no-audit --no-fund --silent && cd ..
          set -o pipefail
          timeout 1200 node test/e2e.js 2>&1 | tee e2e.log
          echo "--- duel_history ---" | tee -a e2e.log
          sqlite3 server/plugins/DuelSira/dueldata.db "select id,duel_type,arena_name,winner_uuid is not null,duration_seconds from duel_history" 2>&1 | tee -a e2e.log

      - name: Publish E2E log
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATUS="${{ steps.e2e.outcome }}"
          touch e2e.log
          if ! gh release view ci-e2e >/dev/null 2>&1; then
            gh release create ci-e2e --prerelease --title "CI e2e" --notes "init" --target "${GITHUB_SHA}"
          fi
          gh release edit ci-e2e --notes "sha=${GITHUB_SHA} status=${STATUS}"
          gh release upload ci-e2e e2e.log --clobber
          if [ -f server/logs/latest.log ]; then cp server/logs/latest.log server-latest.log; gh release upload ci-e2e server-latest.log --clobber; fi

  release:
    needs: [build, e2e]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plugin jar
        uses: actions/download-artifact@v4
        with:
          name: DuelSira
          path: dist

      - name: Source zip
        run: git archive --format=zip --prefix=DuelSira/ -o "dist/DuelSira-${GITHUB_REF_NAME}-source.zip" HEAD

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="RELEASE_NOTES.md"
          [ -f "$NOTES" ] || echo "${GITHUB_REF_NAME}" > "$NOTES"
          gh release create "${GITHUB_REF_NAME}" dist/* --title "DuelSira ${GITHUB_REF_NAME}" --notes-file "$NOTES"
