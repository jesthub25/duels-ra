settings:
  # Normal duel isteginin gecerlilik suresi (saniye)
  request-timeout: 30
  # Duel baslamadan once geri sayim (saniye). Bu surede oyuncular yerinden kipirdayamaz.
  countdown: 5
  # Esyalar korunan / kitli duellolarda kazananin arenadan cikarilma gecikmesi (saniye)
  end-delay: 3
  # "Esyalar duser" modunda kazananin yere dusen esyalari toplamasi icin sure (saniye)
  loot-time: 15
  # Oyuncularin arenadan cikip cikmadigi kac tick'te bir kontrol edilsin (20 tick = 1 sn)
  border-check-interval: 10
  # Ayni anda en fazla kac duel (0 = sinirsiz)
  max-concurrent-duels: 50
  # Duel bitince calistirilacak komut (oyuncu adina). Bos birakilirsa sadece lobby'e isinlanir.
  # /duel setlobby ile ayarlanan lobby varsa once oraya isinlanir, sonra bu komut calisir.
  hub-command: "hub"
  # Olen oyuncu otomatik respawn olsun mu
  auto-respawn: true
  # Duel sirasinda ender pearl yasak mi
  block-ender-pearl: true
  # Duel sirasinda kullanilabilecek komutlar (duel, d, duelsira her zaman serbest)
  allowed-commands:
    - duel
    - d
    - duelsira
  # Arena sifirlama surelerini konsola yaz
  debug: false

# Normal duellolarda (kendi envanteri) kural varsayilanlari
defaults:
  allow-ladder: true
  allow-slab: true
  allow-button: true
  allow-cobweb: true
  allow-elytra: true

# Duel sirasi (NPC'ye sag tik)
queue:
  # Eslesince EVET/HAYIR icin sure (saniye). Yanit vermeyen siradan cikarilir.
  response-time: 15
  # Sira duellolarinda (kendi envanteri, kuralsiz) esyalar yere dussun mu
  items-drop: true
  # NPC'ye ust uste tiklama korumasi (milisaniye)
  click-cooldown-ms: 1000

